<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For San ❤️</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        /* ==========================================
           1. CSS VARIABLES & BASE STYLES
           ========================================== */
        :root {
            --bg-warm-ivory: #FAF7F2;
            --bg-paper: #FCFAF7;
            --baby-pink: #FDE8E9;
            --blush-pink: #F7D6D8;
            --champagne-gold: #D4AF37;
            --champagne-gold-light: #F3E5AB;
            --champagne-gold-border: rgba(212, 175, 55, 0.35);
            --text-dark: #2C2825;
            --text-muted: #8C7A6B;
            --rose-muted: #B87D7B;
            --shadow-soft: 0 10px 30px rgba(184, 125, 123, 0.08);
            --shadow-card: 0 15px 35px rgba(44, 40, 37, 0.04);
            --shadow-glow: 0 0 25px rgba(212, 175, 55, 0.25);
            --radius-sm: 12px;
            --radius-md: 20px;
            --radius-lg: 32px;
            --font-heading: 'Cormorant Garamond', Georgia, serif;
            --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --transition-smooth: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
            background-color: var(--bg-warm-ivory);
            color: var(--text-dark);
            font-family: var(--font-body);
            font-weight: 400;
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
        }

        body {
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Glow Canvas */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
        }

        /* Typography Helper Classes */
        h1, h2, h3, .serif-font {
            font-family: var(--font-heading);
            font-weight: 600;
            line-height: 1.25;
            color: var(--text-dark);
        }

        .subtitle {
            font-size: 1.05rem;
            color: var(--text-muted);
            margin-top: 8px;
            margin-bottom: 40px;
            font-weight: 300;
            letter-spacing: 0.3px;
        }

        .section-tag {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--rose-muted);
            margin-bottom: 12px;
            display: block;
            font-weight: 500;
        }

        /* Layout */
        section {
            min-height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 80px 24px;
            position: relative;
            z-index: 2;
        }

        .container {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            text-align: center;
        }

        .container-wide {
            max-width: 1000px;
            width: 100%;
            margin: 0 auto;
            text-align: center;
        }

        /* Buttons */
        .btn {
            background: linear-gradient(135deg, #FFFFFF, var(--bg-paper));
            border: 1px solid var(--champagne-gold-border);
            color: var(--text-dark);
            padding: 16px 36px;
            font-size: 1rem;
            font-family: var(--font-body);
            font-weight: 500;
            border-radius: 50px;
            cursor: pointer;
            transition: var(--transition-smooth);
            box-shadow: var(--shadow-soft);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            margin-top: 24px;
            outline: none;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-glow);
            border-color: var(--champagne-gold);
        }

        .btn:active {
            transform: translateY(-1px);
        }

        .btn-continue {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.95rem;
            letter-spacing: 1px;
            box-shadow: none;
            cursor: pointer;
            padding: 12px 24px;
            transition: var(--transition-smooth);
            margin-top: 40px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-continue:hover {
            color: var(--text-dark);
            transform: translateY(3px);
            box-shadow: none;
            background: transparent;
        }

        /* Fade Animation Utilities */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1), transform 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* ==========================================
           3. OPENING SCREEN
           ========================================== */
        #opening {
            background-color: var(--bg-warm-ivory);
        }

        #opening h1 {
            font-size: clamp(2.8rem, 6vw, 4.2rem);
            margin: 16px 0;
        }

        #opening p.intro-tag {
            font-size: 1.1rem;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        #opening p.sub-heading {
            font-size: 1.25rem;
            color: var(--rose-muted);
            margin-bottom: 24px;
            font-weight: 300;
        }

        /* ==========================================
           4. BIRTHDAY REVEAL
           ========================================== */
        #reveal-section h1 {
            font-size: clamp(2.5rem, 5vw, 3.8rem);
            margin-bottom: 16px;
        }

        .sunflower-icon {
            font-size: 2.5rem;
            margin: 20px 0;
            display: inline-block;
            filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.3));
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* ==========================================
           5. A FEW THINGS ABOUT YOU
           ========================================== */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 24px;
            margin-top: 30px;
        }

        .card {
            background: var(--bg-paper);
            border: 1px solid var(--champagne-gold-border);
            padding: 36px 28px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-card);
            text-align: left;
            transition: var(--transition-smooth);
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-6px);
            border-color: var(--champagne-gold);
            box-shadow: var(--shadow-soft);
        }

        .card-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--baby-pink);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            color: var(--rose-muted);
        }

        .card h3 {
            font-size: 1.5rem;
            margin-bottom: 12px;
        }

        .card p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
        }

        /* ==========================================
           6. OUR LITTLE STORY
           ========================================== */
        .timeline {
            position: relative;
            max-width: 650px;
            margin: 40px auto 0;
            padding-left: 30px;
            text-align: left;
        }

        .timeline::before {
            content: '';
            position: absolute;
            top: 10px;
            bottom: 10px;
            left: 7px;
            width: 1px;
            background: linear-gradient(180deg, transparent, var(--champagne-gold), transparent);
        }

        .timeline-item {
            position: relative;
            margin-bottom: 40px;
            padding-left: 20px;
        }

        .timeline-item:last-child {
            margin-bottom: 0;
        }

        .timeline-dot {
            position: absolute;
            left: -28px;
            top: 6px;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: var(--champagne-gold);
            box-shadow: 0 0 10px var(--champagne-gold);
        }

        .timeline-title {
            font-size: 0.8rem;
            letter-spacing: 2px;
            color: var(--rose-muted);
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .timeline-text {
            color: var(--text-dark);
            font-size: 1rem;
            line-height: 1.65;
            font-weight: 300;
        }

        /* ==========================================
           7. LITTLE THINGS WORTH REMEMBERING
           ========================================== */
        .remember-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-top: 30px;
        }

        .remember-card {
            background: rgba(253, 232, 233, 0.3);
            border: 1px solid rgba(247, 214, 216, 0.6);
            padding: 24px 20px;
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            color: var(--text-dark);
            transition: var(--transition-smooth);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 90px;
        }

        .remember-card:hover {
            background: var(--baby-pink);
            transform: scale(1.02);
        }

        /* ==========================================
           8. A SONG FOR SAN
           ========================================== */
        .player-card {
            background: var(--bg-paper);
            border: 1px solid var(--champagne-gold-border);
            padding: 40px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
            max-width: 420px;
            margin: 30px auto 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .vinyl-container {
            width: 180px;
            height: 180px;
            position: relative;
            margin-bottom: 30px;
        }

        .vinyl {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle, #2c2825 25%, #1a1816 26%, #1a1816 40%, #2c2825 41%, #1a1816 68%, #2c2825 69%);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: spin 12s linear infinite;
            animation-play-state: paused;
        }

        .vinyl.playing {
            animation-play-state: running;
        }

        .vinyl-center {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--blush-pink);
            border: 2px solid var(--champagne-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            color: var(--text-dark);
            font-family: var(--font-heading);
            font-weight: 600;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .player-status {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .player-controls {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .btn-play {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: var(--text-dark);
            color: var(--bg-warm-ivory);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition-smooth);
        }

        .btn-play:hover {
            transform: scale(1.08);
            background: var(--rose-muted);
        }

        /* ==========================================
           9. A LITTLE WISH FOR YOU
           ========================================== */
        .wishes-container {
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 30px 0;
        }

        .wish-item {
            font-family: var(--font-heading);
            font-size: clamp(1.6rem, 3.5vw, 2.2rem);
            color: var(--text-dark);
            opacity: 0;
            transform: translateY(15px);
            transition: opacity 0.8s ease, transform 0.8s ease;
            position: absolute;
            max-width: 600px;
            padding: 0 20px;
        }

        .wish-item.active {
            opacity: 1;
            transform: translateY(0);
        }

        .wish-final {
            font-family: var(--font-heading);
            font-size: 1.8rem;
            color: var(--rose-muted);
            margin-top: 20px;
            opacity: 0;
            transition: opacity 1s ease;
        }

        .wish-final.show {
            opacity: 1;
        }

        /* ==========================================
           10. ONE LAST THING
           ========================================== */
        #one-last-thing {
            background-color: var(--bg-warm-ivory);
        }

        #one-last-thing h2 {
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        #one-last-thing p {
            font-size: 1.15rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            font-weight: 300;
        }

        /* ==========================================
           11. ENVELOPE ANIMATION & LETTER
           ========================================== */
        #letter-section {
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Envelope Styling */
        .envelope-wrapper {
            position: relative;
            width: 320px;
            height: 220px;
            background: var(--blush-pink);
            border-radius: 8px;
            box-shadow: var(--shadow-card);
            cursor: pointer;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
            margin: 40px auto;
        }

        .envelope-wrapper:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-soft);
        }

        .envelope-flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 160px solid transparent;
            border-right: 160px solid transparent;
            border-top: 120px solid #ECA8AC;
            transform-origin: top;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 4;
        }

        .envelope-pocket {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 160px solid #F3C1C4;
            border-right: 160px solid #F3C1C4;
            border-bottom: 110px solid #EEB2B5;
            border-radius: 0 0 8px 8px;
            z-index: 3;
        }

        .envelope-seal {
            position: absolute;
            top: 100px;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 44px;
            height: 44px;
            background: var(--bg-paper);
            border: 1px solid var(--champagne-gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            z-index: 5;
            box-shadow: var(--shadow-glow);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .letter-preview {
            position: absolute;
            bottom: 15px;
            left: 20px;
            right: 20px;
            height: 160px;
            background: var(--bg-paper);
            border-radius: 4px;
            z-index: 2;
            transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
        }

        /* Envelope Open Animation State */
        .envelope-wrapper.open .envelope-seal {
            opacity: 0;
            transform: translate(-50%, -50%) scale(1.5);
        }

        .envelope-wrapper.open .envelope-flap {
            transform: rotateX(180deg);
            z-index: 1;
        }

        .envelope-wrapper.open .letter-preview {
            transform: translateY(-100px);
            z-index: 4;
        }

        /* Letter Display Styles */
        .letter-paper {
            background: var(--bg-paper);
            border: 1px solid var(--champagne-gold-border);
            border-radius: var(--radius-md);
            padding: Clamp(30px, 6vw, 60px);
            max-width: 680px;
            width: 100%;
            box-shadow: var(--shadow-card);
            text-align: left;
            position: relative;
            margin: 0 auto;
        }

        .letter-paper h2 {
            font-size: 2rem;
            margin-bottom: 24px;
            text-align: center;
            color: var(--text-dark);
        }

        .letter-content p {
            margin-bottom: 18px;
            font-size: 1.02rem;
            line-height: 1.8;
            color: var(--text-dark);
            font-weight: 300;
        }

        /* Second Page Styling */
        .letter-page-2 {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
        }

        .page-2-text {
            font-family: var(--font-heading);
            font-size: clamp(1.4rem, 3vw, 1.8rem);
            line-height: 1.6;
            color: var(--text-dark);
            max-width: 580px;
            margin-bottom: 40px;
            font-weight: 500;
        }

        .page-2-signature {
            font-family: var(--font-heading);
            font-size: 1.4rem;
            color: var(--rose-muted);
            line-height: 1.5;
        }

        /* Utility Hide/Show */
        .hidden {
            display: none !important;
        }

        /* Accessibility: Reduced Motion */
        @media (prefers-reduced-motion: reduce) {
            *,
